<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - StudentHub</title><link rel="stylesheet" href="style.css">
<style>
body{background:#eef2ff !important;display:flex;flex-direction:column;min-height:100vh}
.bg-anim{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#e0e7ff,#ddd6fe,#fce7f3,#dbeafe);background-size:300% 300%;animation:gradMove 12s ease infinite}
@keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:float 8s ease-in-out infinite}
.blob1{width:320px;height:320px;background:#818cf8;top:-80px;left:-80px}.blob2{width:300px;height:300px;background:#f472b6;bottom:-80px;right:-60px;animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;z-index:2}
.auth-card{width:100%;max-width:420px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:32px;box-shadow:0 20px 50px rgba(79,70,229,.18);animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-card h2{font-size:24px;margin:12px 0 4px;text-align:center}.auth-card p.sub{color:#64748b;font-size:13.5px;text-align:center;margin:0}
.field label{display:block;font-weight:600;font-size:12.5px;margin:16px 0 6px;color:#334155}
.field input,.field select{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:white;font-family:inherit}
.field input:focus{border-color:#4f46e5;box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.btn-auth{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:20px;cursor:pointer;background:linear-gradient(90deg,#4f46e5,#7c3aed,#ec4899);background-size:200% 100%;color:white;animation:gradMove 4s ease infinite;box-shadow:0 10px 25px rgba(79,70,229,.3)}
.demo-box{margin-top:16px;background:#fffbeb;border:1px dashed #f59e0b;border-radius:12px;padding:12px;font-size:13px;text-align:center;line-height:1.7;cursor:pointer}
body.dark{background:#0b1120 !important}body.dark .auth-card{background:rgba(17,28,50,.88) !important;border-color:#1e293b !important}body.dark .field input,body.dark .field select{background:#0b1120 !important;color:white !important;border-color:#334155 !important}body.dark .demo-box{background:#1e293b !important}
</style></head><body>
<div class="bg-anim"><div class="blob blob1"></div><div class="blob blob2"></div></div>
<div class="nav"><div class="logo"><span>S</span> StudentHub</div><a href="/">🏠 Landing</a><a href="/signup">Sign up</a><a class="active" href="/login">Log in</a><button class="dark-btn" onclick="toggleDark()" id="darkBtn">🌙 Dark</button></div>
<div class="auth-wrap"><div class="auth-card"><div style="text-align:center"><div style="width:60px;height:60px;background:linear-gradient(135deg,#4f46e5,#ec4899);color:white;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">🔐</div></div><h2>Welcome Back!</h2><p class="sub">Login to go to your Home Dashboard</p>
<form id="loginForm">
<div class="field"><label>👤 Username / Student ID *</label><input name="username" id="username" placeholder="e.g. admin or 101" required></div>
<div class="field"><label>🔑 Password *</label><input type="password" name="password" id="password" placeholder="••••••••" required></div>
<div class="field"><label>🎭 Login As</label><select id="roleSelect"><option value="STUDENT">Student</option><option value="ADMIN">Admin</option></select></div>
<button class="btn-auth" type="submit">Login → Go to Home</button>
</form>
<div class="demo-box" onclick="fillDemo()">✨ <b>Click to Auto-Fill Demo</b><br>👑 Admin: <b>admin / admin123</b> &nbsp;•&nbsp; 🧪 Student: <b>101 / 101</b></div>
<p style="text-align:center;font-size:13.5px;color:#64748b;margin-top:16px">New here? <a href="/signup" style="color:#4f46e5;font-weight:700">Create Free Account →</a></p>
<p style="text-align:center;font-size:12.5px;margin-top:8px"><a href="/" style="color:#94a3b8">← Back to Landing</a></p>
</div></div>
<script>
if(localStorage.getItem('dark')==='1') document.body.classList.add('dark');
function toggleDark(){ document.body.classList.toggle('dark'); let d=document.body.classList.contains('dark'); localStorage.setItem('dark',d?'1':'0'); document.getElementById('darkBtn').innerText=d?'☀️ Light':'🌙 Dark'; }
setTimeout(()=>{ let b=document.getElementById('darkBtn'); if(b) b.innerText=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark'; },100);
if(localStorage.getItem('role')){ location.href='/home'; }
function showToast(m,t){ let o=document.querySelector('.toast'); if(o) o.remove(); let d=document.createElement('div'); d.className='toast '+(t||'success'); d.innerText=m; document.body.appendChild(d); setTimeout(()=>{ d.classList.add('hide'); setTimeout(()=>d.remove(),300); },3000); }
function fillDemo(){ document.getElementById('username').value='admin'; document.getElementById('password').value='admin123'; document.getElementById('roleSelect').value='ADMIN'; showToast('✅ Demo filled - Click Login','success'); }
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  let u=document.getElementById('username').value.trim(); let p=document.getElementById('password').value.trim(); let r=document.getElementById('roleSelect').value;
  if(!u || !p){ showToast('❌ Enter username & password','error'); return; }
  // ADMIN DEMO - Works even without backend
  if(u==='admin' && p==='admin123' && r==='ADMIN'){ localStorage.setItem('role','ADMIN'); localStorage.setItem('username','admin'); localStorage.setItem('studentId','admin'); showToast('✅ Welcome Admin!','success'); setTimeout(()=>location.href='/home',700); return; }
  // STUDENT DEMO - 101 / 101
  if(u==='101' && p==='101' && r==='STUDENT'){ localStorage.setItem('role','STUDENT'); localStorage.setItem('username','101'); localStorage.setItem('studentId','101'); showToast('✅ Welcome Student!','success'); setTimeout(()=>location.href='/home',700); return; }
  // REAL BACKEND - Try /api/login then /login
  try{
    let res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,role:r})});
    if(res.ok){ let data=await res.json(); localStorage.setItem('role',data.role||r); localStorage.setItem('username',data.username||u); localStorage.setItem('studentId',data.studentId||u); showToast('✅ Welcome back, '+(data.username||u)+'!','success'); setTimeout(()=>location.href='/home',700); return; }
  }catch(err){}
  // Fallback - If backend uses form POST, let it submit normally - save locally and go home
  localStorage.setItem('role',r); localStorage.setItem('username',u); localStorage.setItem('studentId',u);
  showToast('✅ Logged in as '+u,'success'); setTimeout(()=>location.href='/home',700);
});
</script></body></html>
