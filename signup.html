<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up - StudentHub</title><link rel="stylesheet" href="style.css">
<style>
body{background:#eef2ff !important;display:flex;flex-direction:column;min-height:100vh}
.bg-anim{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#dcfce7,#e0e7ff,#ddd6fe,#fce7f3);background-size:300% 300%;animation:gradMove 12s ease infinite}
@keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:float 8s ease-in-out infinite}
.blob1{width:320px;height:320px;background:#34d399;top:-80px;left:-80px}.blob2{width:300px;height:300px;background:#c084fc;bottom:-80px;right:-60px;animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;z-index:2}
.auth-card{width:100%;max-width:460px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:32px;box-shadow:0 20px 50px rgba(5,150,105,.18);animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.field label{display:block;font-weight:600;font-size:12.5px;margin:14px 0 6px;color:#334155}
.field input,.field select{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;background:white;font-family:inherit}
.field input:focus{border-color:#059669;box-shadow:0 0 0 4px rgba(5,150,105,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-auth{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:20px;cursor:pointer;background:linear-gradient(90deg,#059669,#4f46e5,#ec4899);background-size:200% 100%;color:white;animation:gradMove 4s ease infinite;box-shadow:0 10px 25px rgba(5,150,105,.3)}
body.dark{background:#0b1120 !important}body.dark .auth-card{background:rgba(17,28,50,.88) !important;border-color:#1e293b !important}body.dark .field input,body.dark .field select{background:#0b1120 !important;color:white !important;border-color:#334155 !important}
</style></head><body>
<div class="bg-anim"><div class="blob blob1"></div><div class="blob blob2"></div></div>
<div class="nav"><div class="logo"><span>S</span> StudentHub</div><a href="/">🏠 Landing</a><a class="active" href="/signup">Sign up</a><a href="/login">Log in</a><button class="dark-btn" onclick="toggleDark()" id="darkBtn">🌙 Dark</button></div>
<div class="auth-wrap"><div class="auth-card"><div style="text-align:center"><div style="width:60px;height:60px;background:linear-gradient(135deg,#059669,#4f46e5);color:white;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">✦</div></div><h2 style="font-size:24px;margin:12px 0 4px;text-align:center">Create Free Account</h2><p style="color:#64748b;font-size:13.5px;text-align:center;margin:0">Signup → Login → Home Dashboard • 30 sec</p>
<form id="signupForm">
<div class="field"><label>👤 Full Name *</label><input id="name" placeholder="e.g. Rahul Sharma" required></div>
<div class="field"><label>🆔 Student ID / Username *</label><input id="username" placeholder="e.g. 101 or rahul123" required></div>
<div class="row2"><div class="field"><label>📧 Email *</label><input type="email" id="email" placeholder="you@gmail.com" required></div><div class="field"><label>📞 Phone *</label><input id="phone" placeholder="98765 43210" required></div></div>
<div class="row2"><div class="field"><label>🎓 Course</label><select id="course"><option>B.Tech CSE</option><option>B.Tech ECE</option><option>BCA</option><option>MCA</option><option>B.Sc</option><option>Other</option></select></div><div class="field"><label>🎭 Role</label><select id="role"><option value="STUDENT">Student</option><option value="ADMIN">Admin</option></select></div></div>
<div class="field"><label>🔑 Password *</label><input type="password" id="password" placeholder="Min 4 chars" required></div>
<button class="btn-auth" type="submit">Create Account → Go to Login</button>
</form>
<p style="text-align:center;font-size:13.5px;color:#64748b;margin-top:16px">Already have account? <a href="/login" style="color:#059669;font-weight:700">Login →</a></p>
<p style="text-align:center;font-size:12.5px;margin-top:8px"><a href="/" style="color:#94a3b8">← Back to Landing</a></p>
</div></div>
<script>
if(localStorage.getItem('dark')==='1') document.body.classList.add('dark');
function toggleDark(){ document.body.classList.toggle('dark'); let d=document.body.classList.contains('dark'); localStorage.setItem('dark',d?'1':'0'); document.getElementById('darkBtn').innerText=d?'☀️ Light':'🌙 Dark'; }
setTimeout(()=>{ let b=document.getElementById('darkBtn'); if(b) b.innerText=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark'; },100);
if(localStorage.getItem('role')){ location.href='/home'; }
function showToast(m,t){ let o=document.querySelector('.toast'); if(o) o.remove(); let d=document.createElement('div'); d.className='toast '+(t||'success'); d.innerText=m; document.body.appendChild(d); setTimeout(()=>{ d.classList.add('hide'); setTimeout(()=>d.remove(),300); },3000); }
document.getElementById('signupForm').addEventListener('submit', async function(e){
  e.preventDefault();
  let name=document.getElementById('name').value.trim(); let username=document.getElementById('username').value.trim(); let email=document.getElementById('email').value.trim(); let phone=document.getElementById('phone').value.trim(); let course=document.getElementById('course').value; let role=document.getElementById('role').value; let pass=document.getElementById('password').value.trim();
  if(!name || !username || !email || !phone || pass.length<4){ showToast('❌ Fill all fields, password min 4','error'); return; }
  // Try real backend
  try{ await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,username:username,email:email,phone:phone,course:course,role:role,password:pass})}); }catch(err){}
  try{ await fetch('/signup',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'name='+encodeURIComponent(name)+'&username='+encodeURIComponent(username)+'&email='+encodeURIComponent(email)+'&phone='+encodeURIComponent(phone)+'&course='+encodeURIComponent(course)+'&role='+encodeURIComponent(role)+'&password='+encodeURIComponent(pass)}); }catch(err){}
  // Save for demo - so login works immediately
  localStorage.setItem('pendingUser', username);
  showToast('✅ Account Created for '+name+'! Please Login','success');
  setTimeout(()=>{ location.href='/login'; }, 900);
});
</script></body></html>
